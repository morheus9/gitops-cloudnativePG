apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: myapp-db
  namespace: portal-1-prod
spec:
  instances: 3

  imageName: ghcr.io/cloudnative-pg/postgresql:16.2

  storage:
    size: 50Gi
    # For local deployment, use empty string to use default storage class
    # For production, specify your storage class: fast-ssd, ssd, etc.
    storageClass: "standard" # Specify storage class explicitly due to local-path provisioner issues

  resources:
    requests:
      memory: "1Gi"
      cpu: "1"
    limits:
      memory: "2Gi"
      cpu: "2"

  # Network Setting
  enableSuperuserAccess: false

  # Backup settings (using VolumeSnapshot)
  # backup:
  #   volumeSnapshot:
  #     className: csi-hostpath-snapclass
  #   retentionPolicy: "30d" # Keep backups for 30 days

  monitoring:
    enablePodMonitor: true

  postgresql:
    parameters:
      shared_buffers: "512MB"
      max_connections: "200"

#  nodeSelector:
#    workload: postgres

#  tolerations:
#  - key: "postgres"
#    operator: "Equal"
#    value: "true"
#    effect: "NoSchedule"
