apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-tls
  namespace: vault
spec:
  secretName: vault-tls-server
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  commonName: vault.vault.svc.cluster.local
  dnsNames:
    - vault.vault.svc.cluster.local
    - vault.vault.svc
    - vault
    - vault.local
    - localhost
  issuerRef:
    name: internal-ca-issuer
    kind: ClusterIssuer
