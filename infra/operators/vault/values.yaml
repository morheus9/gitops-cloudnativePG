server:
  standalone:
    enabled: false
  ha:
    enabled: true
    replicas: 2
    raft:
      enabled: true
      setNodeId: true
      config: |
        storage "raft" {
          path = "/vault/data"
          node_id = "vault-${POD_NAME}"  # will be changed with Raft env
          retry_join {
            leader_api_addr = "http://vault-0.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://vault-1.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://vault-2.vault-internal:8200"
          }
          autopilot {
            cleanup_dead_servers = "true"
            last_contact_threshold = "5s"
            min_quorum = 3
          }
        }

        listener "tcp" {
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_cert_file = "/vault/userconfig/tls-server/tls.crt"
          tls_key_file  = "/vault/userconfig/tls-server/tls.key"
        }

        seal "awskms" {
          region     = "us-east-1"
          kms_key_id = "alias/vault-unseal"
        }

        audit "file" {
          path = "/vault/logs/audit.log"
        }

        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname = true
        }

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  affinity: |
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: vault
                app.kubernetes.io/instance: vault
            topologyKey: kubernetes.io/hostname

  # TLS-secret
  extraVolumes:
  - name: tls-server
    secret:
      secretName: vault-tls-server
  extraVolumeMounts:
  - name: tls-server
    mountPath: /vault/userconfig/tls-server
    readOnly: true

extraEnvironmentVars:
  POD_NAME:
    valueFrom:
      fieldRef:
        fieldPath: metadata.name

ui:
  enabled: true
  ingress:
    enabled: true
    hosts:
    - vault.local
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls:
    - hosts:
      - vault.local
      secretName: vault-ui-tls

# Storage for Raft (each pod will receive its own PVC)
dataStorage:
  enabled: true
  size: 100Gi
  storageClass: fast-ssd
  accessMode: ReadWriteOnce
