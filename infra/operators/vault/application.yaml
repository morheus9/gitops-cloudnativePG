apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"  # After cert-manager (needs internal-ca-issuer)
spec:
  project: infra
  source:
    repoURL: https://github.com/morheus9/gitops-cloudnativePG
    targetRevision: HEAD
    path: infra/operators/vault
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
