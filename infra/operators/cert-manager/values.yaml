installCRDs: true

extraObjects:
  # Let's Encrypt Staging Issuer - for testing certificates without rate limits
  # Use this issuer for development/testing environments
  - apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: letsencrypt-staging
    spec:
      acme:
        email: admin@example.com
        server: https://acme-staging-v02.api.letsencrypt.org/directory
        privateKeySecretRef:
          name: letsencrypt-staging-key
        solvers:
          - http01

  # Let's Encrypt Production Issuer - for production certificates
  # Use this issuer for production environments with real domains
  - apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: letsencrypt-prod
    spec:
      acme:
        email: admin@example.com
        server: https://acme-v02.api.letsencrypt.org/directory
        privateKeySecretRef:
          name: letsencrypt-prod-key
        solvers:
          - http01:
              ingress:
                class: nginx

  # Root CA Issuer - creates the root certificate authority
  # This self-signed issuer generates the root CA certificate (root-ca)
  # It's the foundation that signs all internal certificates
  - apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: root-ca-issuer
    spec:
      selfSigned: {}

  # Root CA Certificate - the root certificate authority
  # This certificate acts as the root CA for all internal certificates
  # It's stored in root-ca-secret and used by internal-ca-issuer to sign other certificates
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: root-ca
      namespace: cert-manager
    spec:
      isCA: true
      commonName: root-ca
      secretName: root-ca-secret # Secret where the root CA certificate is stored
      privateKey:
        algorithm: ECDSA
        size: 256
      issuerRef:
        name: root-ca-issuer
        kind: ClusterIssuer

  # Internal CA Issuer - issues certificates for internal services
  # This issuer uses the root CA certificate to sign certificates for internal services
  # Use this issuer for Vault, databases, and other internal Kubernetes services
  - apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: internal-ca-issuer
    spec:
      ca:
        secretName: root-ca-secret

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# For working in a cluster with pods on different node
podDnsPolicy: "Default"
podDnsConfig:
  options:
    - name: single-request-reopen

prometheus:
  enabled: true
