installCRDs: true

extraObjects:
  # Example1 ClusterIssuer
  - apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: letsencrypt-staging
    spec:
      acme:
        email: admin@example.com
        server: https://acme-staging-v02.api.letsencrypt.org/directory
        privateKeySecretRef:
          name: letsencrypt-staging-key
        solvers:
          - http01
  # Example2 ClusterIssuer
  - apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: letsencrypt-prod
    spec:
      acme:
        email: admin@example.com
        server: https://acme-v02.api.letsencrypt.org/directory
        privateKeySecretRef:
          name: letsencrypt-prod-key
        solvers:
          - http01:
              ingress:
                class: nginx
  # My issuer
  - apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: selfsigned-issuer
    spec:
      selfSigned: {}

  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: my-ca
      namespace: cert-manager
    spec:
      isCA: true
      commonName: my-ca
      secretName: my-ca-secret # the secret of where the root CA will be stored
      privateKey:
        algorithm: ECDSA
        size: 256
      issuerRef:
        name: selfsigned-ca-issuer
        kind: ClusterIssuer

  - apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: my-ca-issuer
    spec:
      ca:
        secretName: my-ca-secret

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# For working in a cluster with pods on different node
podDnsPolicy: "Default"
podDnsConfig:
  options:
    - name: single-request-reopen

prometheus:
  enabled: true
