installCRDs: true

extraObjects:
# Example issuer
- apiVersion: cert-manager.io/v1
  kind: ClusterIssuer
  metadata:
    name: letsencrypt-staging
  spec:
    acme:
      email: admin@example.com
      server: https://acme-staging-v02.api.letsencrypt.org/directory
      privateKeySecretRef:
        name: letsencrypt-staging-key
      solvers:
      - http01:
          ingress:
            class: nginx
# Example2 issur
- apiVersion: cert-manager.io/v1
  kind: ClusterIssuer
  metadata:
    name: letsencrypt-prod
  spec:
    acme:
      email: admin@example.com
      server: https://acme-v02.api.letsencrypt.org/directory
      privateKeySecretRef:
        name: letsencrypt-prod-key
      solvers:
      - http01:
          ingress:
            class: nginx
- apiVersion: cert-manager.io/v1
  kind: ClusterIssuer
  metadata:
    name: letsencrypt-prod
  spec:
    acme:
      email: admin@example.com
      server: https://acme-v02.api.letsencrypt.org/directory
      privateKeySecretRef:
        name: letsencrypt-prod-key
      solvers:
      - http01:
          ingress:
            class: nginx
# Vault issuer
- apiVersion: cert-manager.io/v1
  kind: ClusterIssuer
  metadata:
    name: vault-issuer
  spec:
    vault:
      server: http://vault.vault.svc:8200
      path: /v1/pki/sign/my-role
  auth:
    kubernetes:
      role: cert-manager-role
      mountPath: /v1/auth/kubernetes

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

# For working in a cluster with pods on different node
podDnsPolicy: "Default"
podDnsConfig:
  options:
  - name: single-request-reopen

prometheus:
  enabled: true
