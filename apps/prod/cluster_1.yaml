apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: myapp-db
  namespace: database
spec:
  instances: 3

  imageName: ghcr.io/cloudnative-pg/postgresql:16.2

  storage:
    size: 50Gi
    storageClass: fast-ssd

  resources:
    requests:
      memory: "2Gi"
      cpu: "1"
    limits:
      memory: "4Gi"
      cpu: "2"

  # Настройки сети
  enableSuperuserAccess: false

  # Настройки резервного копирования (используем VolumeSnapshot)
  backup:
    volumeSnapshot:
      className: csi-hostpath-snapclass # Класс снапшотов
    retentionPolicy: "30d" # Хранить бэкапы 30 дней

  monitoring:
    enablePodMonitor: true

  postgresql:
    parameters:
      shared_buffers: "512MB" # Пример настройки
      max_connections: "200"

