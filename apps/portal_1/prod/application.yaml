apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portal-1-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3" # After infrastructure operators
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: applications
  source:
    repoURL: https://github.com/morheus9/gitops-cloudnativePG
    targetRevision: HEAD
    path: apps/portal_1/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: portal-1-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
